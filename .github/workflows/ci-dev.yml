name: Development CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: HTML Hint Validation
        uses: htmlhint/htmlhint-action@v2
        with:
          path: 'src/**/*.html'

      - name: Verify Docker Image Build
        run: |
          docker build -t cs-dept-web:dev .
          docker images